<div class="navbar bg-linear-to-r from-primary to-black drop-shadow-lg">
  <div class="flex-1">
    <a class="text-2xl text-white">DateMe</a>
  </div>
  <div class="flex gap-2">
    @if (accountService.currentUser(); as user) {
    <div class="flex items-center gap-2">
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
          <div class="w-10 rounded-full">
            <img alt="login-user" src="/user.png" />
          </div>
        </div>
        <ul
          tabindex="-1"
          class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
        >
          <li>
            <a class="justify-between">
              Profile
              <span class="badge">Logged In</span>
            </a>
          </li>
          <li><a>Settings</a></li>
          <li><a (click)="logout()">Logout</a></li>
        </ul>
      </div>

      <div class="text-xl text-white">{{user.displayName}}</div>
    </div>
    }@else{

    <form #loginForm="ngForm" (ngSubmit)="login()" class="flex gap-2">
      <input
        [(ngModel)]="creds.email"
        name="email"
        type="email"
        placeholder="Search"
        class="input input-bordered w-24 md:w-auto"
      />
      <input
        [(ngModel)]="creds.password"
        name="password"
        type="password"
        placeholder="Password"
        class="input input-bordered w-24 md:w-auto"
      />
      <button type="submit" class="btn">Login</button>
    </form>
    }
  </div>
</div>
