@if (_register()) {
    <app-register (cancelRegister)="register($event)"/>
}@else {
    <div
  class="hero min-h-screen"
  style="
    background-image: url(https://img.daisyui.com/images/stock/photo-1507358522600-9f71e620c44e.webp);
  "
>
  <div class="hero-overlay"></div>
  <div class="hero-content text-neutral-content text-center">
    <div class="max-w-md flex flex-col items-center">
      <h1 class="mb-5 text-5xl font-bold">Find Your Perfect Match</h1>
      <p class="mb-5">
        Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
        quasi. In deleniti eaque aut repudiandae et a id nisi.
      </p>
      <div class="flex gap-2 items-center content-center">
        <button class="btn btn-primary" (click)="register(true)">Register now</button>
        <button class="btn btn-secondary">Learn More</button>
      </div>
    </div>
  </div>
</div>

}
