@if (!memberService.isEditMode()) {
    @if (photos(); as photos) 
    {
        @if (photos.length > 0) 
        {
        <div class="grid grid-cols-4 auto-rows-min h-[70vh] gap-3 overflow-auto">
            @for (photo of photos; track photo.id) 
            {
                <div class="relative">
                    <img src="{{photo.url}}" alt="photo of member" class="w-full rounded-lg">
                    @if (memberService.member()?.id == accountService.currentUser()?.id) 
                    {
                        <div class="flex justify-between items-center w-full absolute top-1 z-50 px-2">
                            <app-delete-button [isDisabled]="photo.url === memberService.member()?.imageUrl" (clickEvent)="deletePhoto(photo.id)" />
                            
                            <app-star-button [isDisabled]="photo.url === memberService.member()?.imageUrl"
                                [isSelected]="photo.url === memberService.member()?.imageUrl" (clickEvent)="setMainPhoto(photo)" />
                        </div>
                    }
                </div>
            }
        </div>
        }
    }@else {
    <p class="text-center text-gray-500">No photos available</p>   }
}@else {
    <app-image-upload (uploadFile)="onUploadImage($event)" [loading]="loading()"/>
}
