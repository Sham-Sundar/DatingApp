@if (memberService.member(); as member) {
<div class="flex flex-col gap-3">
    <div class="flex gap-3">
        <span class="font-semibold"> Member since:</span>
        <span>{{member.created | date: 'longDate'}}</span>
    </div>
    <div class="flex gap-3">
        <span class="font-semibold"> Last active:</span>
        <span>{{member.lastActive | date: 'dd MMM yyyy h:mm a'}}</span>
    </div>
    <h3 class="text-lg font-semibold text-primary"> About {{member.displayName}}</h3>
    @if (memberService.isEditMode()) {
    <form #editForm="ngForm" (submit)="updateProfile()" class="flex flex-col w-full gap-4">
        <label class="floating-label">
            <span>Display Name</span>
            <input 
                class="input input-primary outline-none w-full" 
                [(ngModel)]="editedMember.displayName"
                name="displayName" 
                placeholder="Display Name" />
        </label>
        <label class="floating-label">
            <span>Description</span>
            <textarea 
                class="textarea input-primary outline-none w-full" 
                [(ngModel)]="editedMember.description" 
                name="description"
                placeholder="Description">
            </textarea>
        </label>
        <label class="floating-label">
            <span>City</span>
            <input 
                class="input input-primary outline-none w-full" 
                [(ngModel)]="editedMember.city" 
                name="city"
                placeholder="City" />
        </label>
        <label class="floating-label">
            <span>Country</span>
            <input 
                class="input input-primary outline-none w-full" 
                [(ngModel)]="editedMember.country" 
                name="country"
                placeholder="Country" />
        </label>
        <div class="flex justify-end">
            <button type="submit" class="btn btn-secondary" [disabled]="!editForm.dirty">Submit</button>
        </div>
    </form>
    }@else {
    <div>{{member.description}}</div>
    }
</div>
}
