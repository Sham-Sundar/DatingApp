<div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Register Now!</h1>
      <p class="py-6">
        Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
        quasi. In deleniti eaque aut repudiandae et a id nisi.
      </p>
    </div>
    <div class="card bg-base-100 w-full max-w-xl shrink-0 shadow-2xl">
      <div class="card-body p-10">
        <form [formGroup]="registerForm" (ngSubmit)="register()" class="fieldset gap-4">
          <label class="floating-label">
            <span>Email</span>
            <input formControlName="email" type="email" class="input w-full" placeholder="Email" />
          </label>

          <label class="floating-label">
            <span>Display Name</span>
            <input formControlName="displayName" class="input w-full" placeholder="Display Name" />
          </label>

          <label class="floating-label">
            <span>Password</span>
            <input formControlName="password" type="password" class="input w-full" placeholder="Password" />
          </label>

          <label class="floating-label">
            <span>Confirm Password</span>
            <input formControlName="confirmPassword" type="password" class="input w-full" placeholder="Password" />
          </label>

          <button [disabled]="registerForm.invalid" class="btn btn-primary mt-3" type="submit">Register</button>
          <button class="btn hover:btn-error hover:text-white" type="submit" (click)="cancel()">Cancel</button>
        </form>
        <div class="flex flex-col w-full px-3 mockup-code text-lg">
          <div>Form Value: {{registerForm.value | json}}</div>
          <div>Form Status: {{registerForm.status | json}}</div>
        </div>
      </div>
    </div>

  </div>
</div>
